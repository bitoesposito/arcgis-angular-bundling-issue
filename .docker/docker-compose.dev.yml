services:
  app:
    image: webpack-build:dev
    build:
      context: .
      dockerfile: .docker/Dockerfile.dev
    ports:
      - '4200:4200'
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'

volumes:
  dev_node_modules:
